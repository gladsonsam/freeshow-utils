[package]
name = "freeshow-utils"
version = "0.1.2"
description = "Lightweight companion utilities for FreeShow"
authors = ["Gladson Sam"]
license = "GPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "freeshow_utils_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# Wayland won't let a client position its own windows, so the output display is
# chosen through GTK instead - see src/output_window.rs. Version must track the
# gtk Tauri itself links against.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

