<style>
  #stage {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 1.5vh;
    background-size: cover;
    background-position: center;
  }

  #card {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: rgba(0, 0, 0, 0.88);
    border-radius: 12px;
    overflow: hidden;
  }

  #placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
    font-size: 2.4vh;
  }

  #blocks {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .block {
    flex: 1;
    display: flex;
    align-items: stretch;
    min-height: 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .block:last-child {
    border-bottom: none;
  }

  .group {
    flex-shrink: 0;
    width: 6vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #444;
    color: #fff;
    font-weight: 700;
    font-size: 2.1vh;
    letter-spacing: 0.02em;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    text-align: center;
    padding: 1.4vh 0;
  }

  .lyrics {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2.4vh;
    padding: 2.4vh 3.6vh;
    overflow: hidden;
  }

  .line {
    position: relative;
  }

  .chords {
    position: relative;
    height: 1.3em;
    line-height: 0;
    white-space: nowrap;
  }

  /* invisible mirror of the lyric text, so each chord's static position lands
     exactly above the character FreeShow recorded it at */
  .chords .ghost {
    opacity: 0;
    line-height: 0;
    font-size: 4.6vh;
    font-weight: 700;
  }

  .chord {
    position: absolute;
    top: 0;
    line-height: 1;
    font-weight: 700;
    font-size: 2.7vh;
    color: #f5b400;
    white-space: nowrap;
  }

  .chord sup {
    font-size: 0.65em;
    top: -0.5em;
  }

  .text {
    font-size: 4.6vh;
    font-weight: 700;
    line-height: 1.25;
  }

  #bar {
    flex-shrink: 0;
    display: flex;
    align-items: stretch;
    background: #000;
  }

  .pill {
    display: flex;
    align-items: center;
    padding: 1.1vh 2.4vh;
    font-size: 2.5vh;
    font-weight: 700;
    color: #fff;
  }

  #showName {
    background: #4caf50;
  }

  #nextName {
    background: #2b8fd6;
    flex: 1;
    justify-content: flex-end;
  }

  .tab {
    flex-shrink: 0;
    width: 3.4vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #000;
    font-weight: 700;
    font-size: 1.5vh;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
  }

  #clock {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 3vh;
    font-weight: 700;
    font-feature-settings: "tnum" 1;
    padding: 1vh 2vh;
  }
</style>

<div id="stage">
  <div id="card">
    <div id="placeholder">Waiting for FreeShow…</div>
    <div id="blocks" hidden></div>
    <div id="bar" hidden>
      <div class="pill" id="showName">—</div>
      <div class="tab">Current</div>
      <div id="clock"></div>
      <div class="tab">Next</div>
      <div class="pill" id="nextName">—</div>
    </div>
  </div>
</div>

<script>
  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  // "C#m7" -> C#m with a superscript 7;  "B/D#" -> left whole
  function chordHtml(label, style) {
    var slash = label.indexOf("/");
    var main = slash >= 0 ? label.slice(0, slash) : label;
    var suffix = slash >= 0 ? label.slice(slash) : "";
    var match = main.match(/^(.*?)(\d+)$/);
    var body = match ? esc(match[1]) + "<sup>" + esc(match[2]) + "</sup>" : esc(main);
    return '<span class="chord" style="' + esc(style) + '">' + body + esc(suffix) + "</span>";
  }

  function lineHtml(line) {
    var chars = Array.from(line.text);
    var inline = {};
    var trailing = [];
    line.chords.forEach(function (chord) {
      if (chord.charIndex < chars.length) inline[chord.charIndex] = chord.label;
      else trailing.push(chord.label);
    });

    var html = '<div class="line">';

    if (Object.keys(inline).length || trailing.length) {
      html += '<div class="chords">';
      chars.forEach(function (char, index) {
        if (inline[index] !== undefined) html += chordHtml(inline[index], "");
        html += '<span class="ghost">' + esc(char) + "</span>";
      });
      trailing.forEach(function (label, index) {
        html += chordHtml(label, "transform: translateX(calc(" + 1.4 * (index + 1) + "em - 50%));");
      });
      html += "</div>";
    }

    html += '<div class="text">';
    line.spans.forEach(function (span) {
      html += '<span style="color:' + esc(span.color) + '">' + esc(span.text) + "</span>";
    });
    return html + "</div></div>";
  }

  function slideHtml(slide) {
    var groupStyle = slide.color ? ' style="background:' + esc(slide.color) + '"' : "";
    return (
      '<div class="block"><div class="group"' +
      groupStyle +
      ">" +
      esc(slide.group) +
      '</div><div class="lyrics">' +
      slide.lines.map(lineHtml).join("") +
      "</div></div>"
    );
  }

  window.onFreeShowUpdate = function (data) {
    var stage = document.getElementById("stage");
    var placeholder = document.getElementById("placeholder");
    var blocks = document.getElementById("blocks");
    var bar = document.getElementById("bar");

    stage.style.backgroundImage = data.background ? 'url("' + data.background + '")' : "";

    placeholder.hidden = data.connected;
    blocks.hidden = !data.connected;
    bar.hidden = !data.connected;
    if (!data.connected) return;

    var slides = [data.current, data.next].filter(Boolean);
    blocks.innerHTML = slides.map(slideHtml).join("");

    document.getElementById("showName").textContent = data.showName || "—";
    document.getElementById("nextName").textContent = data.nextItemName || "—";
    document.getElementById("clock").textContent = data.clock;
  };
</script>
