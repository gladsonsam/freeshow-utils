<style>
  * {
    box-sizing: border-box;
  }

  #stage {
    position: absolute;
    inset: 0;
    display: grid;
    /* minmax(0, 1fr), not 1fr: a plain 1fr track refuses to shrink below its
       content, so the lyrics row would grow and autofit would never kick in */
    grid-template-rows: auto minmax(0, 1fr) auto;
    gap: 2vh;
    padding: 4vh 5vw;
    background: #05060a;
  }

  #group {
    font-size: 2.2vh;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #7f8398;
  }

  #group span {
    display: inline-block;
    padding: 0.6vh 1.6vh;
    border-radius: 999px;
    color: #fff;
  }

  #lyrics {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    min-width: 0;
    overflow: hidden;
  }

  /* a slide that is a picture rather than words - a PDF page, an imported deck.
     Fill the box: FreeShow sends a downscaled copy, so max-width/max-height would
     strand it at its own small natural size. contain, not cover, because a page
     you can only see part of is worse than one that leaves a margin */
  #media {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  [hidden] {
    display: none !important;
  }

  /* A starting size, not a fixed one: autofit only ever scales down from here,
     so a bigger number makes short slides bigger and leaves ones that already
     filled the screen exactly where they were. Raise it until a long slide is
     the smallest you would still want to read from the back of the room. */
  #fit {
    display: inline-flex;
    flex-direction: column;
    gap: 1.2vh;
    text-align: center;
    font-size: 11vh;
    font-weight: 800;
    line-height: 1.15;
    text-wrap: balance;
    transform-origin: center center;
  }

  #foot {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 2vh;
    font-size: 2.4vh;
    color: #7f8398;
  }

  #next {
    font-weight: 600;
    color: #b9bdd0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  #clock {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: #fff;
  }

  #idle {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    font-size: 3vh;
    color: #454a5e;
  }
</style>

<div id="stage">
  <div id="group"></div>
  <div id="lyrics">
    <div id="fit"><div id="idle">Waiting for FreeShow…</div></div>
      <img id="media" alt="" hidden />
  </div>
  <div id="foot">
    <div id="next"></div>
    <div id="clock"></div>
  </div>
</div>

<script>
  // The current slide only, as large as it will go. No chords, no next slide -
  // a good starting point for a vocalist-facing screen.
  // shrink long slides until they fit rather than letting them overflow
  function autofit() {
    var box = document.getElementById("lyrics");
    var fit = document.getElementById("fit");
    if (!box || !fit) return;

    fit.style.transform = "scale(1)";
    if (!box.clientWidth || !box.clientHeight) return;

    var scale = Math.min(1, box.clientWidth / fit.offsetWidth, box.clientHeight / fit.offsetHeight);
    if (scale < 1) fit.style.transform = "scale(" + scale + ")";
  }

  if (window.ResizeObserver) new ResizeObserver(autofit).observe(document.body);

  // FreeShow inlines any picture it can reach, so a `data:` source is already
  // proven and can be drawn at once. Anything still pointing at a URL is media
  // it only had a link to - and those links expire - so it gets loaded
  // off-screen first and only shown once it really arrived.
  var remoteImages = {};

  function imageUsable(src) {
    if (!src) return false;
    if (src.slice(0, 5) === "data:") return true;

    if (remoteImages[src] === undefined) {
      remoteImages[src] = false;
      var probe = new Image();
      probe.onload = function () {
        remoteImages[src] = true;
        if (window.freeShowData) window.onFreeShowUpdate(window.freeShowData);
      };
      probe.src = src;
    }
    return remoteImages[src];
  }

  // Which translation to show for scripture. A passage keeps each version in its
  // own text item, so 0 is the first version in `scripture.versions`, 1 the
  // second. null - the default - shows all of them at once, since a reading is
  // followed rather than sung. Put 0 here for English only.
  var SCRIPTURE_ITEM_INDEX = null;

  // The lines to put on screen.
  //
  // Scripture arrives with the reference and the translation names as one more
  // text item after the verse - FreeShow's own scripture layout puts them there.
  // Blown up to lyric size they crowd out the verse, and the reference is on the
  // pill above anyway, so that item is left to the footer. It is spotted by
  // comparing against the values FreeShow resolved rather than by position, so a
  // customised scripture layout keeps everything it was given.
  function slideLines(data) {
    var slide = data.current;
    if (!data.scripture) return slide.lines;

    var known = [data.scripture.reference, data.scripture.versionLabel];
    var kept = slide.items.filter(function (item) {
      return !item.lines.every(function (line) {
        return known.indexOf(line.text) >= 0;
      });
    });
    if (!kept.length) kept = slide.items;

    // falls back to the last item rather than to nothing, so a passage in fewer
    // translations than expected still shows a verse
    if (SCRIPTURE_ITEM_INDEX !== null && kept.length) {
      return (kept[SCRIPTURE_ITEM_INDEX] || kept[kept.length - 1]).lines;
    }

    return kept.reduce(function (lines, item) {
      return lines.concat(item.lines);
    }, []);
  }

  // Words if the slide has any, otherwise its picture. A slide can have both -
  // lyrics over a still - and then the words are what this screen is for.
  function slideImage(slide) {
    if (!slide || slide.lines.length) return "";
    if (!slide.media || slide.media.type !== "image") return "";
    return imageUsable(slide.media.src) ? slide.media.src : "";
  }

  window.onFreeShowUpdate = function (data) {
    var group = document.getElementById("group");
    var lyrics = document.getElementById("fit");
    var media = document.getElementById("media");

    document.getElementById("clock").textContent = data.clock;
    // for scripture the footer names the translations instead - there is no next
    // project item while a passage is up, and an online bible may require the
    // attribution be shown
    document.getElementById("next").textContent = data.scripture
      ? [data.scripture.versionLabel, data.scripture.attribution].filter(Boolean).join(" · ")
      : data.nextItemName
        ? "Next · " + data.nextItemName
        : "";

    group.textContent = "";
    lyrics.textContent = "";

    var image = slideImage(data.current);
    media.hidden = !image;
    lyrics.hidden = !!image;
    // dropping the src as well stops the old page lingering behind the new one
    if (!image) media.removeAttribute("src");
    else if (media.getAttribute("src") !== image) media.setAttribute("src", image);

    if (!data.current) {
      var idle = document.createElement("div");
      idle.id = "idle";
      idle.textContent = data.connected ? "" : "Waiting for FreeShow…";
      lyrics.appendChild(idle);
      autofit();
      return;
    }

    if (data.current.group) {
      var pill = document.createElement("span");
      pill.textContent = data.current.group;
      pill.style.background = data.current.color || "#2f3346";
      group.appendChild(pill);
    }

    slideLines(data).forEach(function (line) {
      var row = document.createElement("div");
      row.textContent = line.text;
      row.style.color = line.color;
      lyrics.appendChild(row);
    });

    autofit();
  };
</script>
