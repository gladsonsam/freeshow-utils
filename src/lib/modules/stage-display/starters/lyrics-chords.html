<style>
  * {
    box-sizing: border-box;
  }

  /* the rules below set display on these elements, which would otherwise beat
     the browser's default styling for [hidden] */
  [hidden] {
    display: none !important;
  }

  #stage {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 1.5vh;
    background-size: cover;
    background-position: center;
  }

  #card {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: rgba(0, 0, 0, 0.88);
    border-radius: 12px;
    overflow: hidden;
  }

  #placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
    font-size: 2.4vh;
  }

  #blocks {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .block {
    flex: 1;
    display: flex;
    align-items: stretch;
    min-height: 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .block:last-child {
    border-bottom: none;
  }

  .group {
    flex-shrink: 0;
    width: 6vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #444;
    color: #fff;
    font-weight: 700;
    font-size: 2.1vh;
    letter-spacing: 0.02em;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    text-align: center;
    padding: 1.4vh 0;
  }

  .lyrics {
    flex: 1;
    display: flex;
    align-items: center;
    /* vertically centred, but lyrics stay left-aligned */
    justify-content: flex-start;
    padding: 2.4vh 3.6vh;
    min-width: 0;
    overflow: hidden;
  }

  /* a slide that is a picture rather than words - a PDF page, an imported deck.
     It fills its block instead of being scaled by autofit, which only knows how
     to measure text */
  .lyrics.media {
    justify-content: center;
    padding: 1.2vh;
  }

  /* fill the block, not just fit inside it: FreeShow sends a downscaled copy, so
     max-width/max-height would leave it sitting at its own small natural size in
     the middle of an empty box. contain still keeps the page's proportions */
  .lyrics.media img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* shrink-wraps the lines so autofit can measure their real size, then scales
     the whole group uniformly - uniform scale is what keeps chords sitting over
     the right characters */
  .fit {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2.4vh;
    /* scale toward the left edge so autofit never drifts the lines inward */
    transform-origin: left center;
  }

  .line {
    position: relative;
  }

  .chords {
    position: relative;
    height: 1.3em;
    line-height: 0;
    white-space: nowrap;
  }

  /* invisible mirror of the lyric text, so each chord's static position lands
     exactly above the character FreeShow recorded it at */
  .chords .ghost {
    opacity: 0;
    line-height: 0;
    font-size: 4.6vh;
    font-weight: 700;
  }

  .chord {
    position: absolute;
    top: 0;
    line-height: 1;
    font-weight: 700;
    font-size: 2.7vh;
    color: #f5b400;
    white-space: nowrap;
  }

  .chord sup {
    font-size: 0.65em;
    top: -0.5em;
  }

  .text {
    font-size: 4.6vh;
    font-weight: 700;
    line-height: 1.25;
    white-space: nowrap;
  }

  #bar {
    flex-shrink: 0;
    display: flex;
    align-items: stretch;
    background: #000;
  }

  .pill {
    display: flex;
    align-items: center;
    padding: 1.1vh 2.4vh;
    font-size: 2.5vh;
    font-weight: 700;
    color: #fff;
  }

  #showName {
    background: #4caf50;
  }

  #nextName {
    background: #2b8fd6;
    flex: 1;
    justify-content: flex-end;
  }

  .tab {
    flex-shrink: 0;
    width: 3.4vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    color: #000;
    font-weight: 700;
    font-size: 1.5vh;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
  }

  #clock {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 3vh;
    font-weight: 700;
    font-feature-settings: "tnum" 1;
    padding: 1vh 2vh;
  }
</style>

<div id="stage">
  <div id="card">
    <div id="placeholder">Waiting for FreeShow…</div>
    <div id="blocks" hidden></div>
    <div id="bar" hidden>
      <div class="pill" id="showName">—</div>
      <div class="tab">Current</div>
      <div id="clock"></div>
      <div class="tab">Next</div>
      <div class="pill" id="nextName">—</div>
    </div>
  </div>
</div>

<script>
  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  // "C#m7" -> C#m with a superscript 7;  "B/D#" -> left whole
  function chordHtml(label, style) {
    var slash = label.indexOf("/");
    var main = slash >= 0 ? label.slice(0, slash) : label;
    var suffix = slash >= 0 ? label.slice(slash) : "";
    var match = main.match(/^(.*?)(\d+)$/);
    var body = match ? esc(match[1]) + "<sup>" + esc(match[2]) + "</sup>" : esc(main);
    return '<span class="chord" style="' + esc(style) + '">' + body + esc(suffix) + "</span>";
  }

  function lineHtml(line) {
    var chars = Array.from(line.text);
    var inline = {};
    var trailing = [];
    line.chords.forEach(function (chord) {
      if (chord.charIndex < chars.length) inline[chord.charIndex] = chord.label;
      else trailing.push(chord.label);
    });

    var html = '<div class="line">';

    if (Object.keys(inline).length || trailing.length) {
      html += '<div class="chords">';
      chars.forEach(function (char, index) {
        if (inline[index] !== undefined) html += chordHtml(inline[index], "");
        html += '<span class="ghost">' + esc(char) + "</span>";
      });
      trailing.forEach(function (label, index) {
        html += chordHtml(label, "transform: translateX(calc(" + 1.4 * (index + 1) + "em - 50%));");
      });
      html += "</div>";
    }

    html += '<div class="text">';
    line.spans.forEach(function (span) {
      html += '<span style="color:' + esc(span.color) + '">' + esc(span.text) + "</span>";
    });
    return html + "</div></div>";
  }

  // FreeShow inlines any picture it can reach, so a `data:` source is already
  // proven and can be drawn at once. Anything still pointing at a URL is media
  // it only had a link to - and those links expire. Never lay out a block for
  // one of those on the strength of hope: show it only once it has actually
  // loaded, off-screen and out of the way. Rendering optimistically and undoing
  // it on error is what made the slide resize on every change.
  var remoteImages = {};

  function imageUsable(src) {
    if (!src) return false;
    if (src.slice(0, 5) === "data:") return true;

    if (remoteImages[src] === undefined) {
      remoteImages[src] = false;
      var probe = new Image();
      probe.onload = function () {
        remoteImages[src] = true;
        render(window.freeShowData);
      };
      probe.src = src;
    }
    return remoteImages[src];
  }

  // Words if the slide has any, otherwise its picture. A slide can have both -
  // lyrics over a still - and then the words win and the still stays behind.
  function slideImage(slide) {
    if (!slide || slide.lines.length) return "";
    if (!slide.media || slide.media.type !== "image") return "";
    return imageUsable(slide.media.src) ? slide.media.src : "";
  }

  function slideHtml(slide) {
    var groupStyle = slide.color ? ' style="background:' + esc(slide.color) + '"' : "";
    var image = slideImage(slide);

    var body = image
      ? '<div class="lyrics media"><img alt="" src="' + esc(image) + '"></div>'
      : '<div class="lyrics"><div class="fit">' +
        slide.lines.map(lineHtml).join("") +
        "</div></div>";

    return (
      '<div class="block"><div class="group"' +
      groupStyle +
      ">" +
      esc(slide.group) +
      "</div>" +
      body +
      "</div>"
    );
  }

  // Scale each slide's lines down until they fit their box. Without this a slide
  // with several chorded lines simply overflows and gets clipped.
  function autofit() {
    var boxes = document.querySelectorAll(".lyrics");
    for (var i = 0; i < boxes.length; i++) {
      var box = boxes[i];
      // an image block sizes itself with object-fit; scaling it would fight that
      if (box.classList.contains("media")) continue;

      var fit = box.firstElementChild;
      if (!fit) continue;

      fit.style.transform = "scale(1)";

      var style = getComputedStyle(box);
      var availableWidth =
        box.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
      var availableHeight =
        box.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
      if (availableWidth <= 0 || availableHeight <= 0) continue;

      var scale = Math.min(
        1,
        availableWidth / fit.offsetWidth,
        availableHeight / fit.offsetHeight
      );
      if (scale < 1) fit.style.transform = "scale(" + scale + ")";
    }
  }

  // transform doesn't affect layout, so observing the body can't loop
  if (window.ResizeObserver) new ResizeObserver(autofit).observe(document.body);

  // The clock ticks once a second, so updates arrive far more often than the
  // slide actually changes. Rebuilding the blocks every time would throw away
  // and re-decode the slide image once a second; only touch the DOM when the
  // markup genuinely differs.
  var lastBlocksHtml = null;

  function render(data) {
    if (!data) return;

    var stage = document.getElementById("stage");
    var placeholder = document.getElementById("placeholder");
    var blocks = document.getElementById("blocks");
    var bar = document.getElementById("bar");

    // When the slide *is* the picture we show it in the block instead, so
    // painting it behind the card as well would just draw it twice.
    var showsOwnImage = !!slideImage(data.current);
    stage.style.backgroundImage =
      data.background && !showsOwnImage ? 'url("' + data.background + '")' : "";

    placeholder.hidden = data.connected;
    blocks.hidden = !data.connected;
    bar.hidden = !data.connected;
    if (!data.connected) return;

    // The next block is dropped only when it is a picture we cannot show - the
    // next page of an online deck whose link has expired. That block would be a
    // black void taking half the screen off the current slide. A wordless *text*
    // slide still gets its block, as it always has.
    var slides = [data.current];
    if (data.next && !(data.next.media && !slideImage(data.next))) slides.push(data.next);

    var html = slides.filter(Boolean).map(slideHtml).join("");
    if (html !== lastBlocksHtml) {
      lastBlocksHtml = html;
      blocks.innerHTML = html;
      autofit();
    }

    document.getElementById("showName").textContent = data.showName || "—";
    document.getElementById("nextName").textContent = data.nextItemName || "—";
    document.getElementById("clock").textContent = data.clock;
  }

  window.onFreeShowUpdate = render;
</script>
