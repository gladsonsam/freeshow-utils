<style>
  #wrap {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: #0d0e14;
  }

  h1 {
    margin: 0;
    padding: 12px 16px;
    border-bottom: 1px solid #262838;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #6c7089;
  }

  pre {
    flex: 1;
    margin: 0;
    padding: 16px;
    overflow: auto;
    font-family: "JetBrains Mono", Consolas, Monaco, monospace;
    font-size: 12px;
    line-height: 1.6;
    color: #b7c3e0;
    white-space: pre-wrap;
  }
</style>

<div id="wrap">
  <h1>Live StageData</h1>
  <pre id="data">waiting for first update…</pre>
</div>

<script>
  // Everything a template can ever see, printed raw. Handy as a reference while
  // writing your own template, and as a check that data is actually arriving.
  window.onFreeShowUpdate = function (data) {
    document.getElementById("data").textContent = JSON.stringify(data, null, 2);
  };
</script>
